<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - BacRéussite Niger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-connexion">

  <div class="connexion">

    <div class="connexion-gauche">
      <h1>BacRéussite Niger</h1>
      <p class="devise">Rejoins-nous !</p>
      <p class="message">Crée ton compte gratuitement et accède à tous les cours, annales et exercices.</p>
    </div>

    <div class="connexion-droite">
      <h2>Créer un compte</h2>
      <p class="sous-titre">Quelques secondes suffisent</p>

      <label for="nom">Nom complet</label>
      <input type="text" id="nom" placeholder="Ton nom et prénom">

      <label for="identifiant">Email ou numéro de téléphone</label>
      <input type="text" id="identifiant" placeholder="exemple@mail.com">

      <label for="serie">Ta série</label>
      <select id="serie">
        <option>Série A</option>
        <option>Série C</option>
        <option>Série D</option>
        <option>Série E</option>
      </select>

      <label for="motdepasse">Mot de passe</label>
      <input type="password" id="motdepasse" placeholder="Choisis un mot de passe">

      <label for="confirmation">Confirmer le mot de passe</label>
      <input type="password" id="confirmation" placeholder="Répète le mot de passe">

      <button>Créer mon compte</button>

      <p class="inscription">Vous avez déjà un compte ? <a href="connexion.html">Se connecter</a></p>
    </div>

  </div>

</body>
</html>
