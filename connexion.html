<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - BacRéussite Niger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-connexion">

  <div class="connexion">

    <div class="connexion-gauche">
      <h1>BacRéussite Niger</h1>
      <p class="devise">Ensemble vers la réussite !</p>
      <p class="message">Un meilleur avenir commence par une bonne préparation.</p>
    </div>

    <div class="connexion-droite">
      <h2>Se connecter</h2>
      <p class="sous-titre">Accédez à votre espace personnel</p>

      <label for="identifiant">Email ou numéro de téléphone</label>
      <input type="text" id="identifiant" placeholder="exemple@mail.com">

      <label for="motdepasse">Mot de passe</label>
      <input type="password" id="motdepasse" placeholder="Votre mot de passe">

      <div class="souvenir">
        <input type="checkbox" id="souvenir">
        <label for="souvenir">Se souvenir de moi</label>
      </div>

      <button>Se connecter</button>

      <a class="oublie" href="#">Mot de passe oublié ?</a>

      <p class="inscription">Vous n'avez pas de compte ? <a href="inscription.html">S'inscrire</a></p>
    </div>

  </div>

</body>
</html>
